<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CODE SPRINT — Questions</title>
<script>(function(){try{var t=localStorage.getItem('cs-theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="nav">
  <a class="brand" href="/dashboard.html"><span class="brand-mark" data-brand-mark></span><span class="brand-text">CODE SPRINT</span></a>
  <nav class="nav-links">
    <a class="link" href="/dashboard.html"><svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.6"/><rect x="14" y="3" width="7" height="5" rx="1.6"/><rect x="14" y="12" width="7" height="9" rx="1.6"/><rect x="3" y="16" width="7" height="5" rx="1.6"/></svg>Dashboard</a>
    <a class="link" href="/leaderboard.html"><svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 20V12M12 20V4M18 20V9"/></svg>Leaderboard</a>
  </nav>
  <div class="nav-right">
    <div class="nav-extra">
      <span class="user-chip" id="navTeamChip" style="display:none"><span class="dot"></span><span id="navTeam"></span></span>
      <span class="badge" id="roundStatus" style="display:none"></span>
    </div>
    <button class="icon-btn theme-toggle" type="button"></button>
    <button class="btn ghost small" onclick="logout()">Logout</button>
    <button class="icon-btn nav-burger" type="button" aria-label="Menu"></button>
  </div>
</div>

<div class="container wide">
  <!-- LIST VIEW -->
  <div id="listView">
    <div class="row" style="margin-bottom:14px;">
      <span class="ic">📝</span>
      <h2 id="listTitle" style="margin:0">Questions</h2>
      <span class="right"><span class="badge" id="listRoundStatus"></span></span>
    </div>
    <div id="groups"></div>
  </div>

  <!-- DETAIL VIEW -->
  <div id="detailView" class="hidden">
    <div class="row" style="margin-bottom:14px;justify-content:space-between;align-items:center;">
      <div class="row" style="gap:8px;">
        <a class="btn ghost small" href="/dashboard.html" type="button">← Dashboard</a>
        <button class="btn ghost small" id="backList" type="button">📋 Questions</button>
      </div>
      <div class="row" style="gap:8px;">
        <button class="btn ghost small" id="prevBtn" type="button" style="display:none">◀ Previous</button>
        <button class="btn ghost small" id="nextBtn" type="button" style="display:none">Next ▶</button>
      </div>
      <div id="detailBadges"></div>
    </div>
    <div class="grid cols-2" style="align-items:start;">
      <div class="card">
        <h2 id="qTitle">—</h2>
        <div id="qMeta" class="row small-muted" style="margin-bottom:8px;"></div>
        <div class="problem-box"><h4>Problem Statement</h4><div class="problem" id="qStatement"></div></div>
        <div class="problem-box"><h4>Input</h4><div class="problem" id="qInput"></div></div>
        <div class="problem-box"><h4>Output</h4><div class="problem" id="qOutput"></div></div>
        <div class="problem-box"><h4>Constraints</h4><div class="problem" id="qConstraints"></div></div>
        <div class="problem-box"><h4>Examples</h4><div id="qExamples"></div></div>
        <div id="hintArea"></div>
      </div>

      <div class="card">
        <div class="row" id="langRow">
          <span class="ic">⌨️</span>
          <select id="language" style="max-width:220px;"></select>
          <span class="right"></span>
        </div>
        <div style="height:12px"></div>
        <div class="editor-wrap"><div id="editorHost"></div></div>
        <div id="mcqHost" class="hidden" style="display:none;flex-direction:column;gap:10px;margin:10px 0"></div>
        <div style="height:10px"></div>
        <label id="stdinLabel">Custom Input (stdin) <span class="small-muted">— optional, used by Run</span></label>
        <textarea id="stdin" placeholder="Enter input for your program..." style="min-height:70px;font-family:var(--font-mono);"></textarea>
        <div style="height:12px"></div>
        <div class="row actions" style="flex-wrap:wrap;align-items:center;gap:10px">
          <button class="btn ghost" id="runBtn" type="button">▶ Run / Test</button>
          <button class="btn green" id="submitBtn" type="button">✔ Submit</button>
          <button class="btn ghost small" id="hintBtn" type="button">💡 Hint</button>
          <span class="right small-muted" id="bestInfo" style="flex:1 1 auto;text-align:right"></span>
        </div>
        <div style="height:12px"></div>
        <div id="resultArea"></div>
      </div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script src="/js/common.js"></script>
<script src="/js/question.js"></script>
</body>
</html>
